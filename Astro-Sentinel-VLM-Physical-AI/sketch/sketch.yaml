# VENTUNO Q board ID; leave the installed App Lab platform version unpinned.
profiles:
  default:
    fqbn: arduino:zephyr:ventunoq
    platforms:
      - platform: arduino:zephyr
    libraries:
      - Arduino_Modulino (0.10.0)
      - STM32duino VL53L4CD (1.0.5)
      - STM32duino VL53L4ED (1.0.1)
      - Arduino_LSM6DSOX (1.1.2)
      - Arduino_LPS22HB (1.0.2)
      - Arduino_HS300x (1.0.0)
      - ArduinoGraphics (1.1.5)
      - Arduino_LTR381RGB (1.0.0)
      - SHT31 (0.5.3)
default_profile: default
